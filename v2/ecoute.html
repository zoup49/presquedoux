    <main>

      <div class="ecoutes">

        <!-- ═══════════════════════════════════════════════════
             LECTEUR MIXCLOUD
             Pour changer de set : remplace ce qui suit "feed="
             Format : %2Fnom-du-compte%2Fnom-du-set%2F
             (les %2F sont des barres obliques encodées)
             Sur Mixcloud : bouton Share → Embed → copie le lien
             ═══════════════════════════════════════════════════ -->
        <div class="ecoute">
          <h2 class="ecoute-nom">Ambient nocturne</h2>
          <span class="ecoute-meta">Jupiter Jazz · 2026</span>
          <iframe class="lecteur" height="120" loading="lazy"
            src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&light=1&feed=%2Fnom-du-compte%2Fnom-du-set%2F"
            title="Ambient nocturne — Jupiter Jazz"></iframe>
        </div>

        <!-- ═══════════════════════════════════════════════════
             LECTEUR SOUNDCLOUD
             Pour changer de piste : remplace ce qui suit "url="
             Format : https%3A//soundcloud.com/compte/nom-de-la-piste
             color=%231a1a18 → c'est ton noir, ne le change pas
             Sur SoundCloud : Share → Embed → copie l'adresse
             ═══════════════════════════════════════════════════ -->
        <div class="ecoute">
          <h2 class="ecoute-nom">Set d'hiver</h2>
          <span class="ecoute-meta">Dj Stoopify · 2026</span>
          <iframe class="lecteur" height="166" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/djstoopify&color=%231a1a18&show_user=true&show_comments=false&show_teaser=false"
            title="Set d'hiver — Dj Stoopify"></iframe>
        </div>

        <div class="ecoute">
          <h2 class="ecoute-nom">Live Paysage Sonore</h2>
          <span class="ecoute-meta">Jupiter Jazz · 2025</span>
          <iframe class="lecteur" height="166" loading="lazy" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/jupiterjazzzz&color=%231a1a18&show_user=true&show_comments=false&show_teaser=false"
            title="Live Paysage Sonore — Jupiter Jazz"></iframe>
        </div>

      </div>

    </main>

  </div>
